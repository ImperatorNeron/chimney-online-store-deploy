[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

# -----------------------------------------------------------------------------
# All three programs log to the container's stdout/stderr, so the cloud provider
# (Koyeb) collects everything in ONE unified log stream.
# -----------------------------------------------------------------------------

[program:backend]
directory=/app/backend
command=/app/backend/start-backend.sh
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
priority=10

[program:frontend]
directory=/app/frontend
command=npm run start -- --port 3000 --hostname 127.0.0.1
autostart=true
autorestart=true
startsecs=3
environment=NODE_ENV="production",PORT="3000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
# start nginx last, after app processes are coming up
priority=30
