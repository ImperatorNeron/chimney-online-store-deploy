worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log -> stdout so Koyeb collects everything in one stream
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # TLS is terminated upstream (Railway/Koyeb), which forwards the original
    # scheme in X-Forwarded-Proto. Trust that value; fall back to nginx's own
    # $scheme only when the header is absent. Used below so the backend builds
    # https redirects (fixes 307 -> http Mixed Content on trailing-slash URLs).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # gzip for text-based assets
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml application/wasm;

    # Upstreams (both processes live in this same container)
    upstream frontend_upstream {
        server 127.0.0.1:3000;
        keepalive 32;
    }
    upstream backend_upstream {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    server {
        listen 8080;
        server_name _;

        # Allow larger bodies for image uploads (backend caps at 10MB per file)
        client_max_body_size 25m;

        # --- Security headers (baseline) ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS is safe to send; browsers only honor it over HTTPS (Koyeb terminates TLS).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- API: browser calls /backend/* -> backend expects /api/v1/* ---
        location /backend/ {
            rewrite ^/backend/(.*)$ /api/v1/$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection        "";
        }

        # --- Swagger / OpenAPI docs (backend mounts at /api/docs) ---
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection        "";
        }

        # --- Media ---
        # With the S3 (Railway Buckets) backend, buckets are PRIVATE, so media
        # is served by the backend proxy route at /media/*. Route it to the
        # backend directly (no /api/v1 rewrite — the media router is mounted at
        # the app root). Long cache: filenames are unique (uuid), never change.
        location /media/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection        "";
        }

        # --- Next.js static build assets ---
        # Build assets are code/UI, never content — tell crawlers not to index them.
        location /_next/ {
            add_header X-Robots-Tag "noindex" always;
            proxy_pass http://frontend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection        "";
        }

        # --- UI icons / static site graphics (NOT product media) ---
        # These are interface elements (cart, heart, phone...) — keep them out
        # of Google Images. Product media lives under /media and is left indexable.
        location /icons/ {
            add_header X-Robots-Tag "noindex" always;
            proxy_pass http://frontend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection        "";
        }

        location = /favicon.png {
            add_header X-Robots-Tag "noindex" always;
            proxy_pass http://frontend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection        "";
        }

        # --- Everything else -> Next.js ---
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection        "";
        }
    }
}
